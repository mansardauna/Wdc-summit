<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#061322"/>
  <circle cx="32" cy="32" r="28" stroke="#FCE46D" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <!-- Sunburst rays -->
  <g stroke="#FCE46D" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="14" />
    <line x1="32" y1="50" x2="32" y2="56" />
    <line x1="8" y1="32" x2="14" y2="32" />
    <line x1="50" y1="32" x2="56" y2="32" />
    <line x1="15" y1="15" x2="19" y2="19" />
    <line x1="45" y1="45" x2="49" y2="49" />
    <line x1="15" y1="49" x2="19" y2="45" />
    <line x1="45" y1="19" x2="49" y2="15" />
  </g>
  <!-- Globe body -->
  <circle cx="32" cy="32" r="14" fill="#0C233C" stroke="#FCE46D" stroke-width="2.5"/>
  <!-- Latitude / Longitude lines -->
  <ellipse cx="32" cy="32" rx="7" ry="14" stroke="#FCE46D" stroke-width="1.5" opacity="0.8"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#FCE46D" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="32" cy="32" rx="13" ry="5.5" stroke="#FCE46D" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Center beacon -->
  <circle cx="32" cy="32" r="3" fill="#FCE46D"/>
</svg>
